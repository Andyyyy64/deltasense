name: Comparison correctness and package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOLO_OFFLINE: "true"
      YOLO_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]'
      - name: Lint and deterministic offline tests
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mkdir -p artifacts
          python -m pytest --cov=deltasense --cov-branch --cov-fail-under=100 --junitxml=artifacts/pytest.xml
      - name: Build source distribution and wheel
        run: |
          python -m build --sdist
          mkdir -p /tmp/deltasense-sdist
          tar -xzf dist/*.tar.gz -C /tmp/deltasense-sdist --strip-components=1
          python -m build --wheel /tmp/deltasense-sdist --outdir dist
          python scripts/check_artifacts.py --dist dist --output artifacts/build-report.json
      - name: Clean wheel installation and import
        run: |
          python -m venv /tmp/deltasense-wheel
          /tmp/deltasense-wheel/bin/python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/deltasense-wheel/bin/python -m pip install dist/*.whl 'pytest>=8,<10' 'hypothesis>=6,<7'
          cd /tmp
          /tmp/deltasense-wheel/bin/python -c "import deltasense; assert '/tmp/deltasense-wheel/' in deltasense.__file__; assert deltasense.__version__ == '0.1.0'"
          /tmp/deltasense-wheel/bin/python -m pytest /tmp/deltasense-sdist/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-and-local-build
          path: |
            artifacts/pytest.xml
            artifacts/build-report.json
            dist/*
          retention-days: 7
